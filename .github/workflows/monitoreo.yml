# Monitoreo sintético programado (herramientas/k0lmena/tools/monitoreo/README.md).
#
# Corre un smoke de SOLO LECTURA contra el ambiente (por ejemplo, producción) y avisa a Slack y Teams solo
# cuando algo se rompe o se recupera. El historial de corridas se guarda entre ejecuciones con la caché de
# GitHub Actions (así sabe qué cambió) y el informe HTML queda como artefacto de cada corrida.
#
# Para activarlo:
#   1. Settings > Secrets and variables > Actions, y cargá:
#        MONITOREO_URLS     URLs separadas por coma (o subí input/monitoreo.json y no hace falta)
#        SLACK_WEBHOOK_URL  (opcional) webhook de Slack
#        TEAMS_WEBHOOK_URL  (opcional) webhook de un flujo de Teams Workflows
#   2. Descomentá el bloque "schedule" de abajo (viene desactivado para que nadie monitoree sin querer).
#   Mientras tanto se puede correr a mano: Actions > Monitoreo sintético > Run workflow.
name: Monitoreo sintético

on:
  workflow_dispatch:
    inputs:
      escenarios:
        description: "Correr también los escenarios @sintetico de k0lmena (tienen que ser de solo lectura)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "*/30 * * * *"   # cada 30 minutos (UTC). GitHub puede demorar o saltear corridas en horas pico.

permissions:
  contents: read

concurrency:
  group: monitoreo
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONITOREO_URLS: ${{ secrets.MONITOREO_URLS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      MONITOREO_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ESCENARIOS: ${{ inputs.escenarios && '--escenarios' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Historial de corridas anteriores
        uses: actions/cache/restore@v4
        with:
          path: output/monitoreo
          key: monitoreo-${{ github.run_id }}
          restore-keys: monitoreo-

      - name: Dependencias
        run: |
          npm ci --prefix herramientas/k0lmena --no-audit --no-fund
          if [ -n "$ESCENARIOS" ]; then npx --prefix herramientas/k0lmena playwright install --with-deps chromium; fi

      - name: Monitorear
        id: monitorear
        working-directory: herramientas/k0lmena
        run: node -r ./env.js tools/monitoreo/monitorear.js $ESCENARIOS

      - name: Guardar historial
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/monitoreo
          key: monitoreo-${{ github.run_id }}

      - name: Informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-monitoreo
          path: output/monitoreo/*/informe-monitoreo.html
          retention-days: 14
          if-no-files-found: ignore
