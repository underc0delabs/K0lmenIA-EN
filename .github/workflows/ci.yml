# Checks for the k0lmenIA repo itself: the Python and Node scripts the agents use.
# Does not run the k0lmena suites (those need the app under test): use npm test for that.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests (pytest)
        run: python -m pytest tests -q

      - name: Node tests
        run: npm run test:repo

      - name: Valid configuration JSON
        run: |
          node -e "for (const f of ['.mcp.json', '.claude/settings.json', 'package.json', 'tools/k0lmena/package.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
