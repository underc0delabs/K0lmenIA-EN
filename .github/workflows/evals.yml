# Agent evals (scripts/evaluate_agents.py). SPENDS TOKENS: only runs manually, from
# Actions > Agent evals > Run workflow. Needs the ANTHROPIC_API_KEY secret in the repo.
# See evals/README.md.
name: Agent evals

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to evaluate (empty = all cases)"
        required: false
        default: ""
      model:
        description: "Model (empty = Claude Code's default)"
        required: false
        default: ""
      budget:
        description: "Spending cap per case, in USD"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--run --budget-usd ${{ inputs.budget }}"
          if [ -n "${{ inputs.agent }}" ]; then ARGS="$ARGS --agent ${{ inputs.agent }}"; fi
          if [ -n "${{ inputs.model }}" ]; then ARGS="$ARGS --model ${{ inputs.model }}"; fi
          python scripts/evaluate_agents.py $ARGS

      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals
          path: evals/results/
